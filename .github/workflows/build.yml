name: Build GlassWA

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Clean build
        run: gradle clean :app:assembleDebug --no-build-cache
      - name: Verify Xposed entrypoint
        run: |
          test "$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/xposed_init)" = "com.glasswa.core.HookEntry"
          unzip -p app/build/outputs/apk/debug/app-debug.apk classes.dex > /tmp/classes.dex
          strings /tmp/classes.dex | grep -q 'Lcom/glasswa/core/HookEntry;'
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glasswa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
