name: Build GlassWA

on:
  push:
    branches: [ main, dev ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: KEYSTORE_BASE64 is not available to this workflow."
            echo "Check that it is a Repository secret under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/glasswa-release.jks"; then
            echo "ERROR: KEYSTORE_BASE64 is not valid Base64."
            exit 1
          fi
          if [ ! -s "$RUNNER_TEMP/glasswa-release.jks" ]; then
            echo "ERROR: decoded keystore is empty."
            exit 1
          fi
      - name: Build signed APK
        env:
          GLASSWA_KEYSTORE_PATH: ${{ runner.temp }}/glasswa-release.jks
          GLASSWA_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          GLASSWA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          GLASSWA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle clean :app:assembleDebug --no-build-cache -PbuildVersionCode=${{ github.run_number }}
      - name: Verify Xposed entrypoint
        run: |
          test "$(unzip -p app/build/outputs/apk/debug/app-debug.apk assets/xposed_init)" = "com.glasswa.core.HookEntry"
          unzip -q app/build/outputs/apk/debug/app-debug.apk -d /tmp/glasswa-apk
          found=0
          for dex in /tmp/glasswa-apk/classes*.dex; do
            if strings "$dex" | grep -Fq 'com/glasswa/core/HookEntry'; then
              found=1
              break
            fi
          done
          test "$found" = 1
      - name: Verify signing certificate
        run: apksigner verify --print-certs app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glasswa-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
